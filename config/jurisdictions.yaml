      - code: "IR-SA"
        name: "Information Regulator (South Africa)"
        portal_url: "https://inforegulator.org.za/"
        sector: "Data Privacy, AI & Cloud Computing"
        regulation_standard: "Protection of Personal Information Act (POPIA) & Security Compromise Rules"
    search_queries:
      - '"SARB" OR "FSCA" OR "Prudential Authority" South Africa (directive OR "joint standard" OR crypto OR CASP OR AI OR cybersecurity)'

recommended_api_integrations:
  - api_name: "CUBE Regulatory Intelligence API (incl. Thomson Reuters Regulatory Intelligence)"
    provider_type: "Paid"
    description: "Delivers machine-readable regulatory change feeds, rulebook diffs, and enforcement alerts across 180+ jurisdictions including CBUAE, DFSA, ADGM, VARA, SAMA, QCB, and SARB."
    documentation_url: "https://cube.global"
  - api_name: "UAE Ministry of Industry and Advanced Technology (MoIAT) Open Data API"
    provider_type: "Free"
    description: "Public REST/JSON endpoints for UAE federal technical standards, conformity assessment registries, and industrial regulations."
    documentation_url: "https://moiat.gov.ae/en/open-data"
  - api_name: "Bayanat.ae (UAE Federal Open Data Portal CKAN API)"
    provider_type: "Free"
    description: "Official UAE government open data CKAN REST API providing programmatic access to federal datasets and regulatory metadata."
    documentation_url: "https://bayanat.ae"
  - api_name: "Saudi Open Data Portal API (SDAIA / open.data.gov.sa)"
    provider_type: "Free"
    description: "REST API maintained by SDAIA providing open datasets and public compliance metadata across Saudi ministries and commissions."
    documentation_url: "https://open.data.gov.sa"
  - api_name: "Ascent RegTech Obligations API"
    provider_type: "Paid"
    description: "Extracts granular, actionable compliance obligations from multi-hundred-page financial rulebooks via REST API."
    documentation_url: "https://www.ascentregtech.com"
  - api_name: "Libryo (ERM) Legal & Gazette Tracking API"
    provider_type: "Paid"
    description: "Provides automated statutory and official gazette tracking across South Africa, UAE, and MENAT jurisdictions."
    documentation_url: "https://libryo.com"
