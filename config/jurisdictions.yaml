        name: "South African Reserve Bank (SARB) / Prudential Authority (PA)"
        portal_url: "https://www.resbank.co.za/en/home/publications/prudential-authority"
        sector: "Banking & Central Banking"
        regulation_standard: "Directive No. 01 of 2024 (NPS Cyber-Resilience) & Joint Standard on Cybersecurity"
      - code: "FSCA"
        name: "Financial Sector Conduct Authority (FSCA)"
        portal_url: "https://www.fsca.co.za/"
        sector: "Virtual Assets, Crypto & Blockchain"
